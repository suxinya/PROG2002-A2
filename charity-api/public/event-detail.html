<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Detail</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="create-event.html">Create New Event</a>
    </nav>
    <div class="container">
        <div id="errorBox"></div>
        <div id="detailContent"></div>
        <h1>Event Details</h1>
        <p>Event Name: <span id="eventName"></span></p>
        <p>Category: <span id="category"></span></p>
        <p>Location: <span id="location"></span></p>
        <p>Date: <span id="eventDate"></span></p>
        <p>Description: <span id="description"></span></p>
        <p>Status: <span id="status"></span></p>
        <button id="deleteBtn">Delete This Event</button>
    </div>
    <script>
        const API_BASE = "http://localhost:3000/api";
        const detailContentDiv = document.getElementById("detailContent");
        const errorBox = document.getElementById("errorBox");
        function showError(message){
            errorBox.innerHTML = `<p class="error-message">${message}</p>`;
        }
        // Retrieve the event_id parameter from the URL
        const params = new URLSearchParams(window.location.search);
        const eventId = params.get('id');

        async function loadEventDetail(){
            if(!eventId){
                showError("No event ID found in URL");
                return;
            }
            try{
                const res = await fetch(`${API_BASE}/events/${eventId}`);
                if(!res.ok) throw new Error("Cannot fetch event data");
                const event = await res.json();
                // Render page content, fill data into html elements
                document.getElementById("eventName").innerText = event.event_name;
                document.getElementById("category").innerText = event.category;
                document.getElementById("location").innerText = event.location;
                document.getElementById("eventDate").innerText = event.event_date;
                document.getElementById("description").innerText = event.description;
                document.getElementById("status").innerText = event.status;
            }catch(err){
                showError("Failed to load event detail: " + err.message);
            }
        }
        window.onload = loadEventDetail;

        // Delete button click event
        document.getElementById("deleteBtn").addEventListener('click',async ()=>{
            if(!confirm("Are you sure to delete this public welfare activity?")) return;
            const res = await fetch(`${API_BASE}/events/${eventId}`,{
                method:"DELETE"
            });
            const data = await res.json();
            if(data.success){
                alert("Successfully deleted!");
                window.location.href="index.html";
            }else{
                alert("Failed to delete event!");
            }
        })
        //Page loading automatic execution
        loadEventDetail();
    </script>
</body>
</html>
